<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<title>Duolingo REA</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#58CC02">

<!-- iOS PWA -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="DuoREA">
<link rel="apple-touch-icon" href="icon-192.svg">

<!-- Fonts -->
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap">

<style>
:root {
  --bg: #131F24;
  --bg-card: #1B2D36;
  --bg-surface: #233842;
  --bg-input: #1B2D36;
  --fg: #EAEFF2;
  --fg-muted: #8A9DAD;
  --fg-dim: #5A7080;
  --green: #58CC02;
  --green-dark: #46A302;
  --green-glow: rgba(88,204,2,0.15);
  --blue: #1CB0F6;
  --blue-dark: #1899D6;
  --orange: #FF9600;
  --red: #FF4B4B;
  --purple: #CE82FF;
  --gold: #FFC800;
  --border: #2A3E4A;
  --radius: 14px;
  --radius-sm: 10px;
  --tab-h: 60px;
  --toolbar-h: 56px;
  color-scheme: dark;
  font-family: 'Nunito', system-ui, sans-serif;
}

@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #F7F7F7;
    --bg-card: #FFFFFF;
    --bg-surface: #F0F0F0;
    --bg-input: #FFFFFF;
    --fg: #1B2733;
    --fg-muted: #6B7D8A;
    --fg-dim: #9AABB5;
    --border: #E2E6E9;
    color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #F7F7F7;
  --bg-card: #FFFFFF;
  --bg-surface: #F0F0F0;
  --bg-input: #FFFFFF;
  --fg: #1B2733;
  --fg-muted: #6B7D8A;
  --fg-dim: #9AABB5;
  --border: #E2E6E9;
  color-scheme: light;
}

*{box-sizing:border-box;margin:0;padding:0}
html{height:100%}
body{
  background:var(--bg);
  color:var(--fg);
  height:100%;
  overflow:hidden;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0;
  font-size:15px;
  line-height:1.5;
  -webkit-tap-highlight-color:transparent;
  -webkit-user-select:none;
  user-select:none;
}

body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:100;background:var(--bg)}

#app{display:flex;flex-direction:column;height:100%;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
.view{display:none;flex:1;flex-direction:column;overflow:hidden}
.view.active{display:flex}

.toolbar{display:flex;align-items:center;gap:8px;padding:8px 16px;min-height:var(--toolbar-h);background:var(--bg);position:sticky;top:env(safe-area-inset-top,0px);z-index:50;flex-shrink:0}
.toolbar-item{display:flex;align-items:center;gap:4px;font-weight:800;font-size:0.88rem;padding:6px 12px;border-radius:20px;background:var(--bg-card);border:1px solid var(--border)}
.toolbar-item .icon{font-size:1.1rem}
.toolbar-item .val{font-variant-numeric:tabular-nums}
.toolbar-spacer{flex:1}

.tab-bar{display:flex;align-items:stretch;min-height:var(--tab-h);background:var(--bg-card);border-top:1px solid var(--border);flex-shrink:0;padding-bottom:env(safe-area-inset-bottom,0px)}
.tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:0.68rem;font-weight:700;color:var(--fg-dim);cursor:pointer;border:none;background:none;transition:color 0.15s;padding:6px 0}
.tab.active{color:var(--blue)}
.tab svg{width:24px;height:24px;fill:currentColor}
.tab:active{transform:scale(0.95)}

.scroll-area{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}

.path-container{display:flex;flex-direction:column;align-items:center;padding:20px 0 100px;min-height:100%}
.section-banner{width:calc(100% - 32px);max-width:400px;padding:14px 20px;margin:12px 0 8px;border-radius:var(--radius);text-align:center;font-weight:800;font-size:1rem;color:#fff;position:relative}
.section-banner .cefr{font-size:0.72rem;font-weight:700;opacity:0.8;margin-top:2px}

.path-row{display:flex;justify-content:center;width:100%;max-width:400px;padding:6px 0;position:relative}

.node{width:64px;height:64px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;font-size:1.3rem;cursor:pointer;position:relative;transition:transform 0.15s,box-shadow 0.15s;border:4px solid transparent;flex-shrink:0}
.node:active{transform:scale(0.92)}
.node.locked{background:var(--bg-surface);border-color:var(--border);color:var(--fg-dim);cursor:default}
.node.locked:active{transform:none}
.node.available{background:var(--blue);border-color:var(--blue-dark);color:#fff;box-shadow:0 4px 0 var(--blue-dark),0 6px 20px rgba(28,176,246,0.3)}
.node.available.bounce{animation:nodeBounce 1.5s ease-in-out infinite}
.node.completed{background:var(--green);border-color:var(--green-dark);color:#fff;box-shadow:0 3px 0 var(--green-dark)}
.node.checkpoint{width:72px;height:72px;background:var(--gold);border-color:#E5B000;color:#fff;box-shadow:0 4px 0 #C89E00;font-size:1.5rem}

.node-connector{position:absolute;width:4px;height:20px;background:var(--border);left:50%;transform:translateX(-50%);top:-14px;border-radius:2px}
.node-connector.done{background:var(--green)}

@keyframes nodeBounce{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}

.node-label{position:absolute;top:calc(100% + 6px);left:50%;transform:translateX(-50%);white-space:nowrap;font-size:0.7rem;font-weight:700;color:var(--fg-muted);pointer-events:none}

.lesson-view{background:var(--bg);position:relative}
.lesson-header{display:flex;align-items:center;gap:12px;padding:12px 16px;flex-shrink:0}
.lesson-close{width:36px;height:36px;border-radius:50%;background:var(--bg-surface);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;cursor:pointer;color:var(--fg-muted);font-size:1.2rem;flex-shrink:0}
.lesson-close:active{transform:scale(0.9)}
.progress-track{flex:1;height:14px;background:var(--bg-surface);border-radius:7px;overflow:hidden}
.progress-fill{height:100%;background:var(--green);border-radius:7px;transition:width 0.4s ease}

.challenge-area{flex:1;display:flex;flex-direction:column;padding:16px;overflow-y:auto}
.challenge-prompt{font-size:1.3rem;font-weight:800;text-align:center;margin-bottom:24px;line-height:1.3}
.challenge-instruction{font-size:0.88rem;color:var(--fg-muted);text-align:center;margin-bottom:16px;font-weight:600}

.audio-btn{width:72px;height:72px;border-radius:20px;background:var(--blue);color:#fff;display:flex;align-items:center;justify-content:center;font-size:2rem;margin:0 auto 20px;cursor:pointer;border:none;box-shadow:0 4px 0 var(--blue-dark);transition:transform 0.1s}
.audio-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--blue-dark)}

.choices-grid{display:grid;gap:10px;width:100%;max-width:400px;margin:0 auto}
.choices-grid.cols-2{grid-template-columns:1fr 1fr}
.choices-grid.cols-1{grid-template-columns:1fr}

.choice-card{padding:14px 16px;background:var(--bg-card);border:2.5px solid var(--border);border-radius:var(--radius);cursor:pointer;font-weight:700;font-size:0.95rem;text-align:center;transition:border-color 0.15s,background 0.15s;display:flex;flex-direction:column;align-items:center;gap:8px;min-width:0}
.choice-card .emoji{font-size:2.5rem}
.choice-card:active{transform:scale(0.97)}
.choice-card.selected{border-color:var(--blue);background:rgba(28,176,246,0.1)}
.choice-card.correct{border-color:var(--green);background:rgba(88,204,2,0.12);color:var(--green)}
.choice-card.incorrect{border-color:var(--red);background:rgba(255,75,75,0.1);color:var(--red)}

.word-bank{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 0}
.word-token{padding:8px 16px;background:var(--bg-card);border:2px solid var(--border);border-radius:var(--radius-sm);font-weight:700;font-size:0.92rem;cursor:pointer;transition:opacity 0.15s,transform 0.1s;box-shadow:0 2px 0 var(--border)}
.word-token:active{transform:translateY(1px);box-shadow:0 1px 0 var(--border)}
.word-token.used{opacity:0.3;pointer-events:none}

.answer-area{min-height:52px;border-bottom:2.5px solid var(--border);margin-bottom:16px;padding:8px 0;display:flex;flex-wrap:wrap;gap:8px}
.answer-token{padding:8px 16px;background:var(--blue);color:#fff;border-radius:var(--radius-sm);font-weight:700;font-size:0.92rem;cursor:pointer;box-shadow:0 2px 0 var(--blue-dark)}
.answer-token:active{transform:translateY(1px)}

.match-container{display:grid;grid-template-columns:1fr 1fr;gap:10px;max-width:400px;margin:0 auto;width:100%}
.match-item{padding:14px 12px;background:var(--bg-card);border:2.5px solid var(--border);border-radius:var(--radius);text-align:center;font-weight:700;font-size:0.9rem;cursor:pointer;transition:all 0.15s;min-width:0;word-break:break-word}
.match-item.selected{border-color:var(--blue);background:rgba(28,176,246,0.1)}
.match-item.matched{border-color:var(--green);background:rgba(88,204,2,0.1);opacity:0.5;pointer-events:none}
.match-item.wrong{border-color:var(--red);animation:shake 0.3s}

.sentence-display{font-size:1.15rem;font-weight:700;text-align:center;line-height:2;margin-bottom:20px}
.blank-slot{display:inline-block;min-width:80px;border-bottom:3px solid var(--blue);padding:2px 8px;margin:0 4px;text-align:center;color:var(--blue);font-weight:800}

.text-input{width:100%;max-width:400px;margin:0 auto;display:block;padding:14px 16px;background:var(--bg-input);border:2.5px solid var(--border);border-radius:var(--radius);color:var(--fg);font-family:inherit;font-size:1rem;font-weight:700;outline:none}
.text-input:focus{border-color:var(--blue)}

.check-bar{padding:12px 16px;flex-shrink:0}
.check-btn{width:100%;max-width:400px;margin:0 auto;display:block;padding:14px;border-radius:var(--radius);border:none;font-family:inherit;font-weight:800;font-size:1rem;cursor:pointer;text-transform:uppercase;letter-spacing:0.03em;transition:transform 0.1s,box-shadow 0.1s}
.check-btn.primary{background:var(--green);color:#fff;box-shadow:0 4px 0 var(--green-dark)}
.check-btn.primary:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark)}
.check-btn:disabled{background:var(--bg-surface);color:var(--fg-dim);box-shadow:0 4px 0 var(--border);cursor:default}
.check-btn.skip{background:var(--bg-surface);color:var(--fg-muted);box-shadow:0 4px 0 var(--border)}

.feedback-bar{padding:16px;flex-shrink:0;border-radius:var(--radius) var(--radius) 0 0;display:none}
.feedback-bar.show{display:block}
.feedback-bar.correct{background:rgba(88,204,2,0.15);color:var(--green)}
.feedback-bar.incorrect{background:rgba(255,75,75,0.12);color:var(--red)}
.feedback-bar .fb-title{font-weight:900;font-size:1.1rem;margin-bottom:4px}
.feedback-bar .fb-text{font-size:0.88rem;font-weight:600}

.session-end{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;gap:20px}
.session-end .big-emoji{font-size:4rem}
.session-end .title{font-size:1.6rem;font-weight:900}
.session-end .xp-display{font-size:2.5rem;font-weight:900;color:var(--gold);display:flex;align-items:center;gap:8px}
.session-end .stat-row{display:flex;gap:20px;justify-content:center}
.session-end .stat{text-align:center}
.session-end .stat .val{font-size:1.4rem;font-weight:900}
.session-end .stat .lbl{font-size:0.78rem;color:var(--fg-muted);font-weight:600}
.session-end .xp-breakdown{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;width:100%;max-width:320px;display:flex;flex-direction:column;gap:8px}
.session-end .xp-row{display:flex;justify-content:space-between;font-weight:700;font-size:0.88rem}
.session-end .xp-row .plus{color:var(--gold)}
.session-end .continue-btn{width:100%;max-width:320px;padding:16px;border-radius:var(--radius);border:none;background:var(--green);color:#fff;font-family:inherit;font-weight:800;font-size:1.05rem;cursor:pointer;box-shadow:0 4px 0 var(--green-dark);text-transform:uppercase}
.session-end .continue-btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green-dark)}

.streak-screen{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:32px 20px;text-align:center;gap:16px}
.streak-number{font-size:4rem;font-weight:900;color:var(--orange)}
.streak-label{font-size:1.1rem;font-weight:800;color:var(--fg-muted)}
.streak-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:6px;max-width:280px;width:100%}
.streak-day{aspect-ratio:1;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:0.72rem;font-weight:700;background:var(--bg-surface);color:var(--fg-dim)}
.streak-day.done{background:var(--orange);color:#fff}
.streak-day.today{border:2px solid var(--orange);color:var(--orange)}

.profile-section{padding:20px 16px}
.profile-header{display:flex;align-items:center;gap:16px;margin-bottom:24px}
.avatar-circle{width:72px;height:72px;border-radius:50%;background:var(--blue);display:flex;align-items:center;justify-content:center;font-size:2.2rem;flex-shrink:0}
.profile-name{font-size:1.3rem;font-weight:900}
.profile-sub{font-size:0.82rem;color:var(--fg-muted);font-weight:600}

.stats-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-bottom:24px}
.stat-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:16px;text-align:center}
.stat-card .val{font-size:1.5rem;font-weight:900;font-variant-numeric:tabular-nums}
.stat-card .lbl{font-size:0.75rem;color:var(--fg-muted);font-weight:700;margin-top:2px}

.achievements-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(90px,1fr));gap:10px}
.badge{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 8px;text-align:center}
.badge .icon{font-size:1.8rem}
.badge .name{font-size:0.68rem;font-weight:700;margin-top:4px;color:var(--fg-muted)}
.badge.earned .icon{filter:none}
.badge:not(.earned) .icon{filter:grayscale(1) opacity(0.4)}

.league-header{text-align:center;padding:20px 16px 12px}
.league-shield{font-size:3rem;margin-bottom:4px}
.league-name{font-size:1.3rem;font-weight:900}
.league-sub{font-size:0.82rem;color:var(--fg-muted);font-weight:600}

.leaderboard{padding:0 16px 20px}
.lb-row{display:flex;align-items:center;gap:10px;padding:12px;border-radius:var(--radius-sm);margin-bottom:6px}
.lb-row.me{background:var(--bg-card);border:1px solid var(--blue)}
.lb-row.promote{background:rgba(88,204,2,0.06)}
.lb-row.demote{background:rgba(255,75,75,0.06)}
.lb-rank{width:28px;font-weight:900;font-size:0.9rem;text-align:center;flex-shrink:0}
.lb-avatar{width:36px;height:36px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:1.1rem;flex-shrink:0}
.lb-name{flex:1;font-weight:700;font-size:0.9rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.lb-xp{font-weight:800;font-size:0.88rem;color:var(--gold);flex-shrink:0;font-variant-numeric:tabular-nums}

.quests-panel{padding:16px}
.quest-card{background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
.quest-card .q-icon{font-size:1.6rem;flex-shrink:0}
.quest-card .q-info{flex:1;min-width:0}
.quest-card .q-title{font-weight:700;font-size:0.88rem}
.quest-card .q-progress{height:8px;background:var(--bg-surface);border-radius:4px;margin-top:6px;overflow:hidden}
.quest-card .q-fill{height:100%;background:var(--green);border-radius:4px;transition:width 0.3s}
.quest-card .q-text{font-size:0.72rem;color:var(--fg-muted);font-weight:600;margin-top:3px}
.quest-card .q-reward{font-weight:800;font-size:0.82rem;color:var(--gold);white-space:nowrap;flex-shrink:0}
.quest-card.done{opacity:0.5}
.quest-card.done .q-fill{background:var(--fg-dim)}

.section-title{font-size:1.1rem;font-weight:900;padding:16px 16px 8px}

@keyframes confettiFall{0%{transform:translateY(-10vh) rotate(0deg);opacity:1}100%{transform:translateY(110vh) rotate(720deg);opacity:0}}
.confetti-piece{position:fixed;width:10px;height:10px;border-radius:2px;z-index:200;pointer-events:none;animation:confettiFall 2.5s ease-out forwards}
@keyframes shake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@keyframes fadeIn{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:translateY(0)}}
.fade-in{animation:fadeIn 0.3s ease}

.overlay{position:fixed;inset:0;background:rgba(0,0,0,0.6);z-index:80;display:none;align-items:center;justify-content:center;padding:20px}
.overlay.show{display:flex}
.modal{background:var(--bg-card);border-radius:var(--radius);padding:24px;max-width:360px;width:100%;text-align:center}
.modal h2{font-size:1.2rem;font-weight:900;margin-bottom:8px}
.modal p{font-size:0.9rem;color:var(--fg-muted);margin-bottom:16px}
</style>
</head>
<body>

<div id="app">
  <div class="view active" id="view-home">
    <div class="toolbar">
      <div class="toolbar-item" id="tb-streak"><span class="icon">🔥</span><span class="val" id="streak-val">0</span></div>
      <div class="toolbar-item" style="color:var(--blue)"><span class="icon">💎</span><span class="val" id="gems-val">500</span></div>
      <div class="toolbar-spacer"></div>
      <div class="toolbar-item" style="color:var(--gold)"><span class="icon">⭐</span><span class="val">Nv. <span id="level-val">1</span></span></div>
    </div>
    <div class="scroll-area" id="home-scroll">
      <div class="path-container" id="path-container"></div>
    </div>
  </div>

  <div class="view" id="view-lesson">
    <div class="lesson-header">
      <div class="lesson-close" id="lesson-close">✕</div>
      <div class="progress-track"><div class="progress-fill" id="lesson-progress"></div></div>
    </div>
    <div class="challenge-area" id="challenge-area"></div>
    <div class="feedback-bar" id="feedback-bar">
      <div class="fb-title" id="fb-title"></div>
      <div class="fb-text" id="fb-text"></div>
    </div>
    <div class="check-bar">
      <button class="check-btn primary" id="check-btn" disabled>Comprobar</button>
    </div>
  </div>

  <div class="view" id="view-session-end">
    <div class="scroll-area"><div class="session-end" id="session-end-content"></div></div>
  </div>

  <div class="view" id="view-streak">
    <div class="scroll-area"><div class="streak-screen" id="streak-content"></div></div>
  </div>

  <div class="view" id="view-explore">
    <div class="toolbar"><div class="toolbar-item" style="font-size:1rem;border:none;background:none;font-weight:900">Explorar</div></div>
    <div class="scroll-area">
      <div class="section-title">Misiones diarias</div>
      <div class="quests-panel" id="quests-panel"></div>
      <div class="section-title">Vocabulario aprendido</div>
      <div id="vocab-list" style="padding:0 16px 20px"></div>
    </div>
  </div>

  <div class="view" id="view-leagues">
    <div class="toolbar"><div class="toolbar-item" style="font-size:1rem;border:none;background:none;font-weight:900">Ligas</div></div>
    <div class="scroll-area">
      <div class="league-header" id="league-header"></div>
      <div class="leaderboard" id="leaderboard"></div>
    </div>
  </div>

  <div class="view" id="view-profile">
    <div class="toolbar"><div class="toolbar-item" style="font-size:1rem;border:none;background:none;font-weight:900">Perfil</div></div>
    <div class="scroll-area"><div class="profile-section" id="profile-content"></div></div>
  </div>

  <div class="tab-bar" id="tab-bar">

function loadState(){try{const s=localStorage.getItem("duolingo-rea-state");if(s)state=JSON.parse(s)}catch(e){}if(!state)state=defaultState()}

function generateQuests(){return[{id:"q1",title:"Completa 2 lecciones",icon:"📖",target:2,progress:0,reward:20,type:"lessons"},{id:"q2",title:"Gana 30 XP",icon:"⭐",target:30,progress:0,reward:15,type:"xp"},{id:"q3",title:"Lección perfecta",icon:"💎",target:1,progress:0,reward:25,type:"perfect"}]}

function speak(text){if(!window.speechSynthesis)return;const u=new SpeechSynthesisUtterance(text);u.lang="en-US";u.rate=0.85;speechSynthesis.cancel();speechSynthesis.speak(u)}

let currentView="home",currentTab="home";
function showView(id,pushTab){document.querySelectorAll(".view").forEach(v=>v.classList.remove("active"));document.getElementById("view-"+id).classList.add("active");currentView=id;if(pushTab){currentTab=id;document.querySelectorAll(".tab").forEach(t=>t.classList.toggle("active",t.dataset.view===id))}document.getElementById("tab-bar").style.display=(id==="lesson"||id==="session-end"||id==="streak")?"none":"flex"}

document.getElementById("tab-bar").addEventListener("click",e=>{const tab=e.target.closest(".tab");if(!tab)return;const v=tab.dataset.view;showView(v,true);if(v==="explore")renderQuests();if(v==="leagues")renderLeagues();if(v==="profile")renderProfile()});

function renderPath(){const container=document.getElementById("path-container");container.innerHTML="";let allLessons=[];COURSE.sections.forEach(sec=>{const banner=document.createElement("div");banner.className="section-banner";banner.style.background=sec.color;banner.innerHTML=sec.icon+" "+sec.title+'<div class="cefr">'+sec.cefr+"</div>";container.appendChild(banner);sec.units.forEach(unit=>{unit.lessons.forEach((lesson,li)=>{allLessons.push({lesson,unit,section:sec});const row=document.createElement("div");row.className="path-row";const offset=((allLessons.length-1)%5);const offsets=[0,-50,0,50,0];row.style.transform="translateX("+offsets[offset]+"px)";const node=document.createElement("div");const completed=state.completedLessons.includes(lesson.id);const prevCompleted=allLessons.length<=1||state.completedLessons.includes(allLessons[allLessons.length-2]?.lesson.id);const isAvailable=!completed&&(allLessons.length===1||prevCompleted);if(unit.type==="checkpoint"){node.className="node "+(completed?"completed":"checkpoint")+(isAvailable?" available bounce":"");node.textContent=completed?"✓":"🏆"}else{node.className="node "+(completed?"completed":isAvailable?"available bounce":"locked");node.textContent=completed?"✓":isAvailable?"▶":"🔒"}if(allLessons.length>1){const conn=document.createElement("div");conn.className="node-connector"+(prevCompleted||completed?" done":"");node.appendChild(conn)}const label=document.createElement("div");label.className="node-label";label.textContent=lesson.title;node.appendChild(label);if(isAvailable||completed)node.addEventListener("click",()=>startLesson(lesson,sec));row.appendChild(node);container.appendChild(row)})})})}

let lessonState=null;
function startLesson(lesson,section){lessonState={lesson,section,challenges:[...lesson.challenges],current:0,correct:0,incorrect:0,startTime:Date.now(),selectedAnswer:null,answered:false,matchState:null};showView("lesson",false);renderChallenge()}

function renderChallenge(){if(!lessonState)return;const ch=lessonState.challenges[lessonState.current];if(!ch){endLesson();return}const area=document.getElementById("challenge-area");const progress=((lessonState.current)/lessonState.challenges.length)*100;document.getElementById("lesson-progress").style.width=progress+"%";const fb=document.getElementById("feedback-bar");fb.className="feedback-bar";fb.style.display="none";const btn=document.getElementById("check-btn");btn.textContent="Comprobar";btn.className="check-btn primary";btn.disabled=true;btn.onclick=()=>checkAnswer();lessonState.selectedAnswer=null;lessonState.answered=false;lessonState.matchState=null;area.innerHTML="";area.className="challenge-area fade-in";const inst=document.createElement("div");inst.className="challenge-instruction";inst.textContent=ch.instruction||"";area.appendChild(inst);switch(ch.type){case"select":renderSelect(ch,area);break;case"translate":renderTranslate(ch,area);break;case"listenTap":renderListenTap(ch,area);break;case"listenType":renderListenType(ch,area);break;case"match":renderMatch(ch,area);break;case"fillBlank":renderFillBlank(ch,area);break;case"tapComplete":renderTapComplete(ch,area);break;default:renderSelect(ch,area)}}

function renderSelect(ch,area){const prompt=document.createElement("div");prompt.className="challenge-prompt";prompt.textContent=ch.prompt;area.appendChild(prompt);if(ch.tts)setTimeout(()=>speak(ch.prompt),300);const grid=document.createElement("div");grid.className="choices-grid cols-2";ch.choices.forEach((c,i)=>{const card=document.createElement("div");card.className="choice-card";card.innerHTML=(c.emoji?'<span class="emoji">'+c.emoji+"</span>":"")+'<span>'+c.text+'</span>';card.addEventListener("click",()=>{if(lessonState.answered)return;grid.querySelectorAll(".choice-card").forEach(x=>x.classList.remove("selected"));card.classList.add("selected");lessonState.selectedAnswer=i;document.getElementById("check-btn").disabled=false});grid.appendChild(card)});area.appendChild(grid)}

function renderTranslate(ch,area){const prompt=document.createElement("div");prompt.className="challenge-prompt";prompt.textContent=ch.prompt;area.appendChild(prompt);const answerArea=document.createElement("div");answerArea.className="answer-area";area.appendChild(answerArea);const bank=document.createElement("div");bank.className="word-bank";const tokens=[...ch.wordBank].sort(()=>Math.random()-0.5);const used=[];const placed=[];tokens.forEach((t,i)=>{const tok=document.createElement("div");tok.className="word-token";tok.textContent=t;tok.addEventListener("click",()=>{if(lessonState.answered||tok.classList.contains("used"))return;tok.classList.add("used");used.push(i);placed.push(t);rp()});bank.appendChild(tok)});area.appendChild(bank);function rp(){answerArea.innerHTML="";placed.forEach((w,pi)=>{const at=document.createElement("div");at.className="answer-token";at.textContent=w;at.addEventListener("click",()=>{if(lessonState.answered)return;placed.splice(pi,1);used.splice(pi,1);bank.children[tokens.indexOf(w)].classList.remove("used");rp()});answerArea.appendChild(at)});lessonState.selectedAnswer=placed.join(" ");document.getElementById("check-btn").disabled=placed.length===0}}

function renderListenTap(ch,area){const audioBtn=document.createElement("button");audioBtn.className="audio-btn";audioBtn.textContent="🔊";audioBtn.addEventListener("click",()=>speak(ch.tts||ch.prompt));area.appendChild(audioBtn);setTimeout(()=>speak(ch.tts||ch.prompt),400);const grid=document.createElement("div");grid.className="choices-grid cols-1";ch.choices.forEach((c,i)=>{const card=document.createElement("div");card.className="choice-card";card.textContent=c.text;card.addEventListener("click",()=>{if(lessonState.answered)return;grid.querySelectorAll(".choice-card").forEach(x=>x.classList.remove("selected"));card.classList.add("selected");lessonState.selectedAnswer=i;document.getElementById("check-btn").disabled=false});grid.appendChild(card)});area.appendChild(grid)}

function renderListenType(ch,area){const audioBtn=document.createElement("button");audioBtn.className="audio-btn";audioBtn.textContent="🔊";audioBtn.addEventListener("click",()=>speak(ch.tts||ch.prompt));area.appendChild(audioBtn);setTimeout(()=>speak(ch.tts||ch.prompt),400);const input=document.createElement("input");input.className="text-input";input.type="text";input.placeholder="Escribe lo que escuchas...";input.autocomplete="off";input.addEventListener("input",()=>{lessonState.selectedAnswer=input.value.trim();document.getElementById("check-btn").disabled=!input.value.trim()});area.appendChild(input);setTimeout(()=>input.focus(),500)}

function renderMatch(ch,area){const container=document.createElement("div");container.className="match-container";const leftItems=[...ch.pairs.map(p=>({text:p.from,pairId:p.from,side:"left"}))].sort(()=>Math.random()-0.5);const rightItems=[...ch.pairs.map(p=>({text:p.to,pairId:p.from,side:"right"}))].sort(()=>Math.random()-0.5);lessonState.matchState={matched:[],selected:null,wrongCount:0,total:ch.pairs.length};function ri(){container.innerHTML="";leftItems.forEach(item=>{const el=document.createElement("div");el.className="match-item"+(lessonState.matchState.matched.includes(item.pairId)?" matched":"");el.textContent=item.text;el.addEventListener("click",()=>hmc(el,item));container.appendChild(el);const rItem=rightItems.find(r=>r.pairId===item.pairId);const rEl=document.createElement("div");rEl.className="match-item"+(lessonState.matchState.matched.includes(rItem.pairId)?" matched":"");rEl.textContent=rItem.text;rEl.addEventListener("click",()=>hmc(rEl,rItem));container.appendChild(rEl)})}function hmc(el,item){if(lessonState.matchState.matched.includes(item.pairId))return;const sel=lessonState.matchState.selected;if(!sel){lessonState.matchState.selected={el,item};el.classList.add("selected")}else if(sel.item.side===item.side){sel.el.classList.remove("selected");lessonState.matchState.selected={el,item};el.classList.add("selected")}else{if(sel.item.pairId===item.pairId){lessonState.matchState.matched.push(item.pairId);lessonState.matchState.selected=null;ri();if(lessonState.matchState.matched.length===lessonState.matchState.total){lessonState.selectedAnswer="matched";setTimeout(()=>checkAnswer(),400)}}else{lessonState.matchState.wrongCount++;el.classList.add("wrong");sel.el.classList.add("wrong");setTimeout(()=>{el.classList.remove("wrong","selected");sel.el.classList.remove("wrong","selected");lessonState.matchState.selected=null},500)}}}ri();area.appendChild(container);document.getElementById("check-btn").style.display="none"}

function renderFillBlank(ch,area){const sent=document.createElement("div");sent.className="sentence-display";let html="";ch.sentence.forEach(part=>{if(part==="___")html+='<span class="blank-slot" id="blank-slot"></span>';else html+=part});sent.innerHTML=html;area.appendChild(sent);const grid=document.createElement("div");grid.className="choices-grid cols-2";ch.choices.forEach(c=>{const card=document.createElement("div");card.className="choice-card";card.textContent=c;card.addEventListener("click",()=>{if(lessonState.answered)return;grid.querySelectorAll(".choice-card").forEach(x=>x.classList.remove("selected"));card.classList.add("selected");document.getElementById("blank-slot").textContent=c;lessonState.selectedAnswer=c;document.getElementById("check-btn").disabled=false});grid.appendChild(card)});area.appendChild(grid)}

function renderTapComplete(ch,area){const prompt=document.createElement("div");prompt.className="challenge-prompt";prompt.textContent=ch.prompt;area.appendChild(prompt);const answerArea=document.createElement("div");answerArea.className="answer-area";area.appendChild(answerArea);const bank=document.createElement("div");bank.className="word-bank";const tokens=[...ch.wordBank].sort(()=>Math.random()-0.5);const placed=[];tokens.forEach(t=>{const tok=document.createElement("div");tok.className="word-token";tok.textContent=t;tok.addEventListener("click",()=>{if(lessonState.answered||tok.classList.contains("used"))return;tok.classList.add("used");placed.push({text:t});rp()});bank.appendChild(tok)});area.appendChild(bank);function rp(){answerArea.innerHTML="";placed.forEach((w,pi)=>{const at=document.createElement("div");at.className="answer-token";at.textContent=w.text;at.addEventListener("click",()=>{if(lessonState.answered)return;bank.children[tokens.indexOf(w.text)].classList.remove("used");placed.splice(pi,1);rp()});answerArea.appendChild(at)});lessonState.selectedAnswer=placed.map(p=>p.text).join(" ");document.getElementById("check-btn").disabled=placed.length===0}}

function checkAnswer(){if(lessonState.answered)return nextChallenge();const ch=lessonState.challenges[lessonState.current];let isCorrect=false;switch(ch.type){case"select":isCorrect=ch.choices[lessonState.selectedAnswer]?.correct===true;highlightChoices(ch);break;case"translate":case"tapComplete":isCorrect=normalize(lessonState.selectedAnswer)===normalize(ch.target);break;case"listenTap":isCorrect=ch.choices[lessonState.selectedAnswer]?.correct===true;highlightChoices(ch);break;case"listenType":isCorrect=normalize(lessonState.selectedAnswer)===normalize(ch.answer);break;case"match":isCorrect=lessonState.matchState.wrongCount===0;break;case"fillBlank":isCorrect=normalize(lessonState.selectedAnswer)===normalize(ch.blank);highlightFillChoices(ch);break}if(isCorrect)lessonState.correct++;else lessonState.incorrect++;lessonState.answered=true;showFeedback(isCorrect,ch);const btn=document.getElementById("check-btn");btn.textContent="Continuar";btn.disabled=false;btn.className="check-btn "+(isCorrect?"primary":"skip");btn.onclick=()=>nextChallenge()}

function normalize(s){return(s||"").toLowerCase().replace(/[^a-záéíóúñü\s]/g,"").replace(/\s+/g," ").trim()}
function highlightChoices(ch){const cards=document.querySelectorAll(".choice-card");cards.forEach((card,i)=>{if(ch.choices[i]?.correct)card.classList.add("correct");else if(i===lessonState.selectedAnswer)card.classList.add("incorrect")})}
function highlightFillChoices(ch){const cards=document.querySelectorAll(".choice-card");cards.forEach(card=>{if(normalize(card.textContent)===normalize(ch.blank))card.classList.add("correct");else if(card.classList.contains("selected"))card.classList.add("incorrect")})}
function showFeedback(correct,ch){const fb=document.getElementById("feedback-bar");fb.className="feedback-bar show "+(correct?"correct":"incorrect");document.getElementById("fb-title").textContent=correct?"¡Correcto! 🎉":"Incorrecto";if(!correct){let answer=ch.target||ch.blank||ch.answer||(ch.choices?.find(c=>c.correct)?.text)||"";document.getElementById("fb-text").textContent="Respuesta correcta: "+answer}else document.getElementById("fb-text").textContent=""}
function nextChallenge(){lessonState.current++;document.getElementById("check-btn").style.display="block";renderChallenge()}

function endLesson(){const ls=lessonState;const accuracy=ls.challenges.length>0?Math.round((ls.correct/ls.challenges.length)*100):0;const isPerfect=ls.incorrect===0;const duration=Math.round((Date.now()-ls.startTime)/1000);let baseXP=ls.lesson.xp||10;let bonusXP=0;if(isPerfect)bonusXP+=5;if(state.streak>=3)bonusXP+=3;const totalXP=baseXP+bonusXP;if(!state.completedLessons.includes(ls.lesson.id))state.completedLessons.push(ls.lesson.id);ls.lesson.words?.forEach(w=>{if(!state.wordsLearned.includes(w))state.wordsLearned.push(w)});state.xp+=totalXP;state.gems+=isPerfect?5:2;while(state.xp>=state.xpToNext){state.xp-=state.xpToNext;state.level++;state.xpToNext=Math.round(state.xpToNext*1.3)}const today=todayStr();if(state.lastPracticeDate!==today){const yesterday=new Date();yesterday.setDate(yesterday.getDate()-1);const yStr=yesterday.toISOString().slice(0,10);if(state.lastPracticeDate===yStr||!state.lastPracticeDate)state.streak++;else state.streak=1;state.lastPracticeDate=today;if(state.streak>state.longestStreak)state.longestStreak=state.streak}if(state.dailyDate!==today){state.dailyLessons=0;state.dailyDate=today}state.dailyLessons++;if(isPerfect)state.perfectCount++;if(state.questDate!==today){state.quests=generateQuests();state.questDate=today}state.quests.forEach(q=>{if(q.type==="lessons")q.progress=Math.min(q.progress+1,q.target);if(q.type==="xp")q.progress=Math.min(q.progress+totalXP,q.target);if(q.type==="perfect"&&isPerfect)q.progress=Math.min(q.progress+1,q.target)});state.quests.forEach(q=>{if(q.progress>=q.target&&!q.claimed){state.xp+=q.reward;q.claimed=true}});state.leagueXP+=totalXP;checkAchievements();saveState();renderSessionEnd(totalXP,baseXP,bonusXP,accuracy,isPerfect,duration)}

function renderSessionEnd(totalXP,baseXP,bonusXP,accuracy,isPerfect,duration){showView("session-end",false);const el=document.getElementById("session-end-content");el.innerHTML="";el.className="session-end fade-in";el.innerHTML='<div class="big-emoji">'+(isPerfect?"🏆":"🎉")+'</div><div class="title">'+(isPerfect?"¡Lección perfecta!":"¡Lección completada!")+'</div><div class="xp-display">+'+totalXP+' XP</div><div class="stat-row"><div class="stat"><div class="val">'+accuracy+'%</div><div class="lbl">Precisión</div></div><div class="stat"><div class="val">'+Math.floor(duration/60)+':'+String(duration%60).padStart(2,"0")+'</div><div class="lbl">Tiempo</div></div><div class="stat"><div class="val">🔥 '+state.streak+'</div><div class="lbl">Racha</div></div></div><div class="xp-breakdown"><div class="xp-row"><span>Base</span><span class="plus">+'+baseXP+'</span></div>'+(bonusXP>0?'<div class="xp-row"><span>Bonus</span><span class="plus">+'+bonusXP+'</span></div>':'')+'<div class="xp-row" style="border-top:1px solid var(--border);padding-top:8px;font-size:1rem"><span>Total</span><span class="plus" style="font-size:1.1rem">+'+totalXP+'</span></div></div><button class="continue-btn" id="session-continue">Continuar</button>';document.getElementById("session-continue").addEventListener("click",()=>showStreakScreen());fireConfetti()}

function showStreakScreen(){showView("streak",false);const el=document.getElementById("streak-content");el.innerHTML="";el.className="streak-screen fade-in";el.innerHTML='<div style="font-size:4rem">🔥</div><div class="streak-number">'+state.streak+'</div><div class="streak-label">'+(state.streak===1?"día de racha":"días de racha")+'</div><div class="streak-calendar" id="streak-cal"></div><button class="continue-btn" style="margin-top:16px" id="streak-continue">Continuar</button>';const cal=document.getElementById("streak-cal");const days=["L","M","X","J","V","S","D"];const today=new Date();const dow=today.getDay()||7;for(let i=1;i<=7;i++){const d=document.createElement("div");d.className="streak-day";if(i<=dow&&i>=dow-state.streak+1&&state.streak>0)d.classList.add("done");if(i===dow)d.classList.add("today");d.textContent=days[i-1];cal.appendChild(d)}document.getElementById("streak-continue").addEventListener("click",()=>{showView("home",true);renderPath();updateToolbar()})}

function fireConfetti(){const colors=["#58CC02","#1CB0F6","#FFC800","#FF9600","#CE82FF","#FF4B4B"];for(let i=0;i<40;i++){const p=document.createElement("div");p.className="confetti-piece";p.style.left=Math.random()*100+"vw";p.style.background=colors[Math.floor(Math.random()*colors.length)];p.style.animationDelay=Math.random()*0.8+"s";p.style.width=(6+Math.random()*8)+"px";p.style.height=(6+Math.random()*8)+"px";document.body.appendChild(p);setTimeout(()=>p.remove(),3500)}}

function checkAchievements(){ACHIEVEMENTS_DEF.forEach(a=>{let val=0;switch(a.type){case"lessons":val=state.completedLessons.length;break;case"streak":val=state.streak;break;case"xp":val=state.xp+(state.level-1)*60;break;case"perfect":val=state.perfectCount;break;case"words":val=state.wordsLearned.length;break;case"sections":val=COURSE.sections.filter(s=>s.units.every(u=>u.lessons.every(l=>state.completedLessons.includes(l.id)))).length;break;case"daily_lessons":val=state.dailyLessons;break;case"league":val=state.league>=2?1:0;break}if(val>=a.threshold&&!state.achievements[a.id])state.achievements[a.id]={earnedAt:todayStr()}})}

function renderQuests(){const panel=document.getElementById("quests-panel");panel.innerHTML="";if(state.questDate!==todayStr()){state.quests=generateQuests();state.questDate=todayStr();saveState()}state.quests.forEach(q=>{const done=q.progress>=q.target;const pct=Math.min(100,Math.round((q.progress/q.target)*100));panel.innerHTML+='<div class="quest-card'+(done?" done":"")+'"><div class="q-icon">'+q.icon+'</div><div class="q-info"><div class="q-title">'+q.title+'</div><div class="q-progress"><div class="q-fill" style="width:'+pct+'%"></div></div><div class="q-text">'+q.progress+'/'+q.target+(done?" ✓":"")+'</div></div><div class="q-reward">+'+q.reward+' XP</div></div>'});const vl=document.getElementById("vocab-list");vl.innerHTML="";if(state.wordsLearned.length===0){vl.innerHTML='<div style="color:var(--fg-muted);font-size:0.9rem;padding:8px 0">Completa lecciones para aprender vocabulario</div>'}else{const grid=document.createElement("div");grid.style.cssText="display:flex;flex-wrap:wrap;gap:8px";state.wordsLearned.forEach(w=>{const chip=document.createElement("div");chip.style.cssText="padding:6px 14px;background:var(--bg-card);border:1px solid var(--border);border-radius:20px;font-size:0.82rem;font-weight:700;cursor:pointer";chip.textContent=w;chip.addEventListener("click",()=>speak(w));grid.appendChild(chip)});vl.appendChild(grid)}}

function renderLeagues(){const hdr=document.getElementById("league-header");const lb=document.getElementById("leaderboard");hdr.innerHTML='<div class="league-shield">'+LEAGUE_ICONS[state.league]+'</div><div class="league-name">Liga '+LEAGUES[state.league]+'</div><div class="league-sub">Top 3 ascienden · Últimos 3 descienden</div>';let entries=[...state.competitors.map(c=>({...c})),{name:"Tú",avatar:"🧑‍🎓",xp:state.leagueXP,isMe:true}];entries.sort((a,b)=>b.xp-a.xp);lb.innerHTML="";entries.forEach((e,i)=>{const rank=i+1;const cls=e.isMe?"me":(rank<=3?"promote":(rank>entries.length-3?"demote":""));lb.innerHTML+='<div class="lb-row '+cls+'"><div class="lb-rank">'+(rank<=3?["🥇","🥈","🥉"][rank-1]:rank)+'</div><div class="lb-avatar" style="background:'+(e.isMe?'var(--blue)':'var(--bg-surface)')+'">'+e.avatar+'</div><div class="lb-name">'+e.name+'</div><div class="lb-xp">'+e.xp+' XP</div></div>'})}

function renderProfile(){const el=document.getElementById("profile-content");const totalXPEver=state.xp+(state.level-1)*60;el.innerHTML='<div class="profile-header"><div class="avatar-circle">🧑‍🎓</div><div><div class="profile-name">Estudiante</div><div class="profile-sub">Inglés para hispanohablantes · Nivel '+state.level+'</div></div></div><div class="stats-grid"><div class="stat-card"><div class="val" style="color:var(--gold)">'+totalXPEver+'</div><div class="lbl">XP Total</div></div><div class="stat-card"><div class="val" style="color:var(--orange)">🔥 '+state.streak+'</div><div class="lbl">Racha</div></div><div class="stat-card"><div class="val" style="color:var(--green)">'+state.completedLessons.length+'</div><div class="lbl">Lecciones</div></div><div class="stat-card"><div class="val" style="color:var(--blue)">'+state.wordsLearned.length+'</div><div class="lbl">Palabras</div></div></div><div class="section-title" style="padding-left:0">Logros</div><div class="achievements-grid" id="achievements-grid"></div>';const ag=document.getElementById("achievements-grid");ACHIEVEMENTS_DEF.forEach(a=>{const earned=!!state.achievements[a.id];ag.innerHTML+='<div class="badge'+(earned?" earned":"")+'"><div class="icon">'+a.icon+'</div><div class="name">'+a.name+'</div></div>'})}

function updateToolbar(){document.getElementById("streak-val").textContent=state.streak;document.getElementById("gems-val").textContent=state.gems;document.getElementById("level-val").textContent=state.level}

document.getElementById("lesson-close").addEventListener("click",()=>{if(lessonState){showView("home",true);renderPath();updateToolbar();lessonState=null}});

loadState();updateToolbar();renderPath();
setTimeout(()=>{const avail=document.querySelector(".node.available");if(avail)avail.scrollIntoView({behavior:"smooth",block:"center"})},300);

if('serviceWorker' in navigator){navigator.serviceWorker.register('sw.js').catch(()=>{})}
</script>
